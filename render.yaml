services:
  - type: web
    name: pathhub
    env: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    plan: free
    healthCheckPath: /
    region: oregon
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /opt/render/project/data/pathhub.db
      - key: BACKUP_DIR
        value: /opt/render/project/data/backups
    disk:
      name: data
      mountPath: /opt/render/project/data
      sizeGB: 1 